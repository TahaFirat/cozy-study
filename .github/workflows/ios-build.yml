name: iOS Build & TestFlight Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS with Xcode on Cloud Mac
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Build Web Application
        run: npm run build

      - name: 5. Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: 6. Setup App Store Connect Private Key
        if: env.APP_STORE_CONNECT_API_KEY != ''
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: 7. Build Xcode Project Archive
        run: |
          cd ios/App
          if [ -n "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "Building Xcode Archive with App Store Connect Provisioning Updates..."
            xcodebuild -workspace App.xcworkspace \
                       -scheme App \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       -allowProvisioningUpdates \
                       -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
                       -authenticationKeyID "${APP_STORE_CONNECT_KEY_ID}" \
                       -authenticationKeyIssuerID "${APP_STORE_CONNECT_ISSUER_ID}" \
                       clean archive \
                       -archivePath ./build/App.xcarchive || \
            xcodebuild -workspace App.xcworkspace \
                       -scheme App \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       clean archive \
                       -archivePath ./build/App.xcarchive
          else
            xcodebuild -workspace App.xcworkspace \
                       -scheme App \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       clean archive \
                       -archivePath ./build/App.xcarchive
          fi

      - name: 8. Package App IPA
        run: |
          echo "Packaging App bundle into Payload/App.ipa..."
          cd ios/App/build
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -r App.ipa Payload
          cd ../../..

      - name: 9. Upload IPA as GitHub Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CozyStudy-iOS-App-IPA
          path: ios/App/build/App.ipa
          retention-days: 14

      - name: 10. Deploy to Apple TestFlight with Diagnostics
        if: env.APP_STORE_CONNECT_API_KEY != ''
        run: |
          echo "Uploading App.ipa to App Store Connect / TestFlight..."
          xcrun altool --upload-app \
            -f ./ios/App/build/App.ipa \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose 2>&1 | tee upload_log.txt || {
              echo "--------------------------------------------------------"
              echo "TestFlight Upload Diagnostic Log:"
              cat upload_log.txt
              echo "--------------------------------------------------------"
              exit 1
            }
