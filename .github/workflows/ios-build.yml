name: iOS Build & TestFlight Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS with Xcode on Cloud Mac
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Build Web Application
        run: npm run build

      - name: 5. Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: 6. Build Xcode Project Archive
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace \
                       -scheme App \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       clean archive \
                       -archivePath ./build/App.xcarchive
          else
            xcodebuild -project App.xcodeproj \
                       -scheme App \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       clean archive \
                       -archivePath ./build/App.xcarchive
          fi

      - name: 7. Upload Build Archive as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Release-Archive
          path: ios/App/build/App.xcarchive
          retention-days: 14

      - name: 8. Package App IPA
        if: env.APP_STORE_CONNECT_API_KEY != ''
        run: |
          echo "Packaging App bundle into Payload/App.ipa..."
          cd ios/App/build
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -r App.ipa Payload
          cd ../../..

      - name: 9. Deploy to Apple TestFlight
        if: env.APP_STORE_CONNECT_API_KEY != ''
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'ios/App/build/App.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}


