name: iOS Build & TestFlight Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS with Xcode on Cloud Mac
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Build Web Application
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyAIgvYJq1aq2hognaUcOE7PcipeURVHIeY' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'cozypixel-125c7.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'cozypixel-125c7' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'cozypixel-125c7.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '291796810804' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:291796810804:web:72544796c97ca818dede61' }}
        run: npm run build

      - name: 5. Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: 6. Install Apple Distribution Certificate & Provisioning Profile
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ios/App/LockIn.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/8a18eb66-4fb3-4712-9312-5dfaad7cccc7.mobileprovision

      - name: 7. Build Xcode Project Archive
        run: |
          cd ios/App
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Building with official Apple Code Signing (Build #${{ github.run_number }})..."
            xcodebuild -project App.xcodeproj \
                       -scheme App \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
                       DEVELOPMENT_TEAM="U3YT2CXH58" \
                       CODE_SIGN_STYLE="Manual" \
                       PROVISIONING_PROFILE_SPECIFIER="LockIn AppStore Profile" \
                       CODE_SIGN_IDENTITY="Apple Distribution" \
                       clean archive \
                       -archivePath ./build/App.xcarchive
          else
            echo "Building unsigned archive fallback..."
            xcodebuild -project App.xcodeproj \
                       -scheme App \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
                       CODE_SIGN_ALLOWED=NO \
                       CODE_SIGN_REQUIRED=NO \
                       clean archive \
                       -archivePath ./build/App.xcarchive
          fi

      - name: 8. Export Official Signed App IPA
        run: |
          cd ios/App
          if [ -f "exportOptions.plist" ] && [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Exporting signed App.ipa using exportOptions.plist..."
            xcodebuild -exportArchive \
                       -archivePath ./build/App.xcarchive \
                       -exportPath ./build/export \
                       -exportOptionsPlist exportOptions.plist
            cp ./build/export/*.ipa ./build/App.ipa || true
          fi

          if [ ! -f "./build/App.ipa" ]; then
            echo "Packaging archive App.ipa..."
            cd build
            mkdir -p Payload
            cp -R App.xcarchive/Products/Applications/App.app Payload/
            zip -r App.ipa Payload
            cd ..
          fi
          cd ../..

      - name: 9. Upload Release Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: LockIn-Signed-iOS-App
          path: |
            ios/App/build/App.ipa
            ios/App/build/App.xcarchive
          retention-days: 14

      - name: 10. Upload to Apple TestFlight / App Store Connect
        if: env.APP_STORE_CONNECT_API_KEY != ''
        run: |
          # Preserve the uploader's exit code when its output is piped through tee.
          # Without pipefail, tee can make a failed upload look successful.
          set -o pipefail

          KEY_ID=$(echo "$APP_STORE_CONNECT_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(echo "$APP_STORE_CONNECT_ISSUER_ID" | tr -d '[:space:]')

          echo "Target Key ID: ${KEY_ID}"
          echo "Target Issuer ID: ${ISSUER_ID}"

          # Reconstruct strict PEM format with Python
          python3 -c "
          import os, re
          raw = os.environ.get('APP_STORE_CONNECT_API_KEY', '').strip()
          b64 = re.sub(r'-----BEGIN [^-]+-----|-----END [^-]+-----|\s+', '', raw)
          lines = [b64[i:i+64] for i in range(0, len(b64), 64)]
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(lines) + '\n-----END PRIVATE KEY-----\n'
          for d in [os.path.expanduser('~/.appstoreconnect/private_keys'), os.path.expanduser('~/.private_keys'), './private_keys']:
              os.makedirs(d, exist_ok=True)
              p = os.path.join(d, 'AuthKey_' + '${KEY_ID}' + '.p8')
              with open(p, 'w') as f:
                  f.write(pem)
              os.chmod(p, 0o600)
              print('Wrote key to', p)
          "

          echo "Verifying key structure:"
          head -n 2 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          tail -n 2 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

          UPLOAD_SUCCESS=false

          # Method 1: xcrun altool
          echo "=== Attempting Upload via xcrun altool ==="
          if xcrun altool --upload-app --type ios --file ./ios/App/build/App.ipa --apiKey "${KEY_ID}" --apiIssuer "${ISSUER_ID}" --verbose 2>&1 | tee altool.log; then
            UPLOAD_SUCCESS=true
            echo "altool upload succeeded!"
          else
            echo "altool upload encountered an issue. Checking log..."
            cat altool.log >> $GITHUB_STEP_SUMMARY
          fi

          # Method 2: iTMSTransporter fallback if needed
          if [ "$UPLOAD_SUCCESS" = false ]; then
            TRANSPORTER=$(find /Applications/Xcode* -name iTMSTransporter 2>/dev/null | head -n 1)
            if [ -n "$TRANSPORTER" ] && [ -x "$TRANSPORTER" ]; then
              echo "=== Attempting Upload via iTMSTransporter ==="
              if "$TRANSPORTER" -m upload -assetFile ./ios/App/build/App.ipa -apiKey "${KEY_ID}" -apiIssuer "${ISSUER_ID}" 2>&1 | tee itms.log; then
                UPLOAD_SUCCESS=true
                echo "iTMSTransporter upload succeeded!"
              else
                cat itms.log >> $GITHUB_STEP_SUMMARY
              fi
            fi
          fi

          # Method 3: Fastlane pilot upload fallback
          if [ "$UPLOAD_SUCCESS" = false ]; then
            echo "=== Attempting Upload via Fastlane ==="
            python3 -c "
            import json, os
            data = {
              'key_id': '${KEY_ID}',
              'issuer_id': '${ISSUER_ID}',
              'key_filepath': os.path.expanduser('~/.appstoreconnect/private_keys/AuthKey_' + '${KEY_ID}' + '.p8'),
              'duration': 1200,
              'in_house': False
            }
            with open('api_key.json', 'w') as f:
                json.dump(data, f)
            "
            if fastlane pilot upload --ipa ./ios/App/build/App.ipa --api_key_path api_key.json --skip_waiting_for_build_processing true 2>&1 | tee fastlane.log; then
              UPLOAD_SUCCESS=true
              echo "Fastlane pilot upload succeeded!"
            else
              cat fastlane.log >> $GITHUB_STEP_SUMMARY
            fi
          fi

          if [ "$UPLOAD_SUCCESS" = false ]; then
            echo "All automated upload methods failed. Check step summary for details."
            exit 1
          fi
