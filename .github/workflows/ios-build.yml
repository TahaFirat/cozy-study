name: iOS Build & TestFlight Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS with Xcode on Cloud Mac
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Build Web Application
        run: npm run build

      - name: 5. Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: 6. Build Xcode Project Archive
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace \
                       -scheme App \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       clean archive \
                       -archivePath ./build/App.xcarchive
          else
            xcodebuild -project App.xcodeproj \
                       -scheme App \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       clean archive \
                       -archivePath ./build/App.xcarchive
          fi

      - name: 7. Upload Build Archive as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Release-Archive
          path: ios/App/build/App.xcarchive
          retention-days: 14

      - name: 8. Deploy to Apple TestFlight (When Secrets Are Added)
        if: env.APP_STORE_CONNECT_API_KEY != ''
        run: |
          echo "Apple App Store Connect API Key detected! Preparing TestFlight upload..."
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          
          # Upload via xcrun altool
          xcrun altool --upload-app -f ./ios/App/build/App.xcarchive/Products/Applications/App.app \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
